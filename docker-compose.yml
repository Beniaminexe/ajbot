services:
  discord-pve-bot:
    build: ./bot
    container_name: discord-pve-bot
    restart: unless-stopped
    env_file:
        - ./bot/.env
  lavalink:
    # Pinned on purpose: 4.2.0+ is required for Discord's DAVE (E2EE) voice.
    # Non-alpine because DAVE uses a native library (libdave); glibc is the safe bet.
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G        # 1GB RAM is enough to start
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
